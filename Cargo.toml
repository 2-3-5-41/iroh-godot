[package]
name = "iroh-godot"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
data-encoding = "2.9.0"
futures-lite = "2.6.1"
godot = { version = "0.4.*", features = [
    "register-docs",
    "experimental-threads",
] }
iroh = "0.96.*"
iroh-tickets = "0.3.0"
log = "0.4.27"
rand = "0.9.2"
serde = "1.0.228"
tokio = { version = "1.49.*", default-features = false, features = [
    "sync",
    "macros",
] }
tracing-subscriber = "0.3.19"
